port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
  tcp_port: 7881

redis:
  # Use embedded Redis for single-instance deployment
  # For production, configure external Redis
  address: ""

keys:
  # API key must match the one in docker-compose.yml
  FCtPq5a/Bd/eyxyMlOyNhE4q8dncEll5vYNWJ2agpbY=: FCtPq5a/Bd/eyxyMlOyNhE4q8dncEll5vYNWJ2agpbY=

room:
  auto_create: true
  max_participants: 150
  empty_timeout: 300
  departure_timeout: 20

logging:
  level: info
  # Enable for debugging
  # level: debug

# Enable development mode for easier testing
# Remove for production
development: true

# TURN server configuration (disabled for local development)
# For production deployment, enable and configure properly
turn:
  enabled: false
