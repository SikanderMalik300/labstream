port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
  tcp_port: 7881

redis:
  # Use embedded Redis for single-instance deployment
  # For production, configure external Redis
  address: ""

keys:
  # Generate your own API key and secret
  # Use: openssl rand -base64 32
  API_KEY: your_api_key_here

room:
  auto_create: true
  max_participants: 150
  empty_timeout: 300
  departure_timeout: 20

logging:
  level: info
  # Enable for debugging
  # level: debug

# Enable development mode for easier testing
# Remove for production
development: true

# Turn server configuration
turn:
  enabled: true
  domain: ""
  cert_file: ""
  key_file: ""
  tls_port: 5349
  udp_port: 3478
  external_tls: false
